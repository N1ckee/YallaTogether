<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="js/register.js" defer></script>
</head>

<body class="register-body">

  <div class="login-wrapper">

    <div class="login-card">

      <img src="images/yalla-together.svg" class="login-logo" alt="Yalla Together">

      <h2>Create Account</h2>

      <form id="register_form">

        <input type="text"
               id="first_name"
               name="first_name"
               placeholder="First Name"
               required>

        <input type="text"
               id="last_name"
               name="last_name"
               placeholder="Last Name"
               required>

        <input type="text"
               id="username"
               name="username"
               placeholder="Username"
               required>

        <input type="email"
               id="email"
               name="email"
               placeholder="Email"
               required>

        <input type="tel"
               id="phone_number"
               name="phone_number"
               placeholder="Phone Number"
               required>

        <input type="password"
               id="password"
               name="password"
               placeholder="Password"
               required>

        <div class="role-options">

          <label>
            <input type="checkbox"
                   id="driver"
                   name="role"
                   value="driver">

            Register as Driver
          </label>

        </div>

        <div id="license_field" class="hidden">

          <input type="text"
                 id="license_number"
                 name="license_number"
                 placeholder="License Number">

        </div>

        <p class="error hidden" id="error_message">
          Error
        </p>

        <button type="submit" class="login-btn">
          Register
        </button>

      </form>

      <p class="create-text">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </div>

  </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="css/style.css" rel="stylesheet">
    <script src="js/dashboard.js" defer></script>
  </head>
  <body>
    <div class="profile-container">
      <img src="images/yalla-together.svg" alt="Profile Picture" class="profile-picture">
      <p><strong><span id="username">Username</span></strong></p>
      <p>rating: <span id="rating">0</span>/5</p>
      <a href="profile.html"><i>edit profile</i></a>
    </div>
    <div class="ride-container">
      <section id="create_ride_section" style="display: none;">
        <h2>Create Ride</h2>
        <form id="create_ride_form">
          <label for="car_id">Select Car:</label>
          <select id="car_id" name="car_id" required>
            <option value="">---Select Car---</option>
          </select>
          <br>
          <label for="start_location">Origin:</label>
          <input type="text" id="start_location" name="start_location" required>
          <br>
          <label for="end_location">Destination:</label>
          <input type="text" id="end_location" name="end_location" required>
          <br>
          <label for="departure_time">Departure Time:</label>
          <input type="datetime-local" id="departure_time" name="departure_time" required>
          <br>
          <label for="arrival_time">Arrival Time:</label>
          <input type="datetime-local" id="arrival_time" name="arrival_time" required>
          <br>
          <label for="distance">Distance (km):</label>
          <input type="number" id="distance" name="distance" step="0.1" min="0" required>
          <br>
          <label for="estimated_time">Estimated Time (minutes):</label>
          <input type="number" id="estimated_time" name="estimated_time" step="1" min="0" required>
          <br>
          <label for="stops">Stops:</label>
          <textarea id="stops" name="stops" rows="3" placeholder="One stop per line"></textarea>
          <p style="color: red; display: none;" id="ride_error_message">Error</p>
          <p style="color: green; display: none;" id="ride_success_message">Success</p>
          <button type="submit">Create Ride</button>
        </form>
      </section>

      <input type="text" id="ride-search" placeholder="Search for rides...">
      <div id="ride-list">
      </div>
    </div>
    <div class="map-container">
      <div id="map"></div>
    </div>
  </body>
</html>

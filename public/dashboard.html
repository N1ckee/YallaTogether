<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="js/dashboard.js" defer></script>
  </head>
  <body>
    <div class="profile-container">
      <img src="images/yalla-together.svg" alt="Profile Picture" class="profile-picture">
      <p><strong><span id="username">Username</span></strong></p>
      <p>rating: <span id="rating">0</span>/5</p>
      <a href="profile.html"><i>edit profile</i></a>
    </div>
    <div class="ride-container">
      <button type="button" id="mode_toggle_btn" style="display: none;">Switch to Driver Mode</button>
      <section id="create_ride_section" style="display: none;">
        <h2>Create Ride</h2>
        <form id="create_ride_form">
          <label for="car_id">Select Car:</label>
          <select id="car_id" name="car_id" required>
            <option value="">---Select Car---</option>
            <option value="__add_car__">Add car</option>
          </select>
          <br>
          <label for="start_location">Origin:</label>
          <input type="text" id="start_location" name="start_location" required>
          <br>
          <label for="end_location">Destination:</label>
          <input type="text" id="end_location" name="end_location" required>
          <br>
          <label for="departure_time">Departure Time:</label>
          <input type="datetime-local" id="departure_time" name="departure_time" required>
          <br>
          <input type="hidden" id="arrival_time" name="arrival_time">
          <input type="hidden" id="distance" name="distance">
          <input type="hidden" id="estimated_time" name="estimated_time">
          <label for="available_seats">Available Seats:</label>
          <input type="number" id="available_seats" name="available_seats" min="1" required>
          <br>
          <p id="distanceInfo" class="distance-box">Select start and arrival points on the map.</p>
          <p style="color: red; display: none;" id="ride_error_message">Error</p>
          <p style="color: green; display: none;" id="ride_success_message">Success</p>
          <button type="submit">Create Ride</button>
        </form>
      </section>

      <div class="ride-controls">
        <input type="text" id="ride-search" placeholder="Search arrival point...">
        <button type="button" id="useLocationBtn">Use Current Location</button>
        <button type="button" id="bookRideBtn" disabled>Book Selected Ride</button>
        <p id="booking_message" class="booking-message" style="display: none;"></p>
      </div>
      <h2 id="ride_list_title">Rides</h2>
      <div id="ride-list">
      </div>
    </div>
    <div class="map-container">
      <div id="map"></div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <div id="registerPage">
      <h1>Register</h1>
      <form id="registerForm" action="/register" method="POST">
        <!-- Information needed for registration of a user--->
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required>
        <br>
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" required>
        <br>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="phone_number">Phone Number:</label>
        <input type="tel" id="phone_number" name="phone_number" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required> 
        <br>

        <!-- Information needed for registration of a driver--->
        <label for="driver">Register as a driver?</label>
        <input type="checkbox" id="driver" name="role" value="driver">

        <span style="display:none;" id="license_field">
            <label for="license_number">License Number:</label>
            <input type="text" id="license_number" name="license_number">
        </span>
        <p style="color: red;" id="error_message">Error</p>
        <button type="submit">Register</button>
      </form>
    </div>
 
    <div id="LoginPage">
      <h1>Login</h1>
      <form id="loginForm">
        <label for="username">Username or Email:</label>
        <input type="text" id="identifier" name="identifier" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <button type="submit">Login</button>
      </form>

    </div>

    <div id="AddCar">
      <h1>Add Car</h1>
      <form>
        <label for="make">Make:</label>
        <input type="text" id="make" name="make" required>
        <br>
        <label for="model">Model:</label>
        <input type="text" id="model" name="model" required>
        <br>
        <label for="year">Year:</label>
        <input type="number" id="year" name="year" required>
        <br>
        <label for="license_plate">License Plate:</label>
        <input type="text" id="license_plate" name="license_plate" required>
        <br>
        <label for="color">Color:</label>
        <input type="text" id="color" name="color" required>
        <br>
        <label for="seating_capacity">Seating Capacity:</label>
        <input type="number" id="seating_capacity" name="seating_capacity" required>
        <br>
        <label for="fule_type">Fuel Type:</label>
        <input type="text" id="fuel_type" name="fuel_type" required>
        <br>
        <label for="fuel_efficiency">Fuel Efficiency (km/l):</label>
        <input type="number" id="fuel_efficiency" name="fuel_efficiency" step="0.1" required>
        <button type="submit">Add Car</button>
      </form>

    </div>

    <div id="CreateRide">
      <h1>Create Ride</h1>
      <form>
        <label for="car">Select Car:</label>
        <Select type="text" id="car" name="car" required> 
          <option value="">---Select Car---</option>
        </select>
        <br>
        <label for="origin">Origin:</label>
        <input type="text" id="origin" name="origin" required>
        <br>
        <label for="destination">Destination:</label>
        <input type="text" id="destination" name="destination" required>
        <br>
        <label for="departure_time">Departure Time:</label>
        <input type="datetime-local" id="departure_time" name="departure_time" required>
        <br>
        <label for="arrival_time">Arrival Time:</label>
        <input type="datetime-local" id="arrival_time" name="arrival_time" required>
        <br>
        <label for="available_seats">Available Seats:</label>
        <input type="number" id="available_seats" name="available_seats" required>
        <br>
        <button type="submit">Create Ride</button>
      </form>
  </body>
  <script>

  // Hides the license field by default and shows it only when the driver checkbox is checked
    const driver_checkbox = document.getElementById('driver');
    const license_field = document.getElementById('license_field');

    driver_checkbox.addEventListener('change', function() {
      if (this.checked) {
        license_field.style.display = 'block';
      } else {
        license_field.style.display = 'none';
      }
    });

  // error handeling
    document.getElementById('register_form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const data = Object.fromEntries(formData.entries());

    try {
      const response = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await response.json();
      if (!response.ok) {
        document.getElementById('error_message').textContent = result.error || 'Registration failed';
        document.getElementById('error_message').style.display = 'block';
      } else {
        // Registration successful, redirect or show success
        window.location.href = '/login';
      }
    } catch (err) {
      document.getElementById('error_message').textContent = 'Network error';
      document.getElementById('error_message').style.display = 'block';
    }
  });



  </script>
</html>
